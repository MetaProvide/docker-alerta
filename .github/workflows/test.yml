name: Test build

on: pull_request

jobs:
  lint_dockerfile:
    runs-on: ubuntu-latest
    container: hadolint/hadolint:latest-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: hadolint
        run: |
          hadolint --version
          hadolint Dockerfile

  build_image:
    runs-on: ubuntu-latest
    needs:
      - lint_dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Test build
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          file: "Dockerfile"
